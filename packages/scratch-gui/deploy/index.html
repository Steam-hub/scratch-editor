<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch Editor</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        #scratch {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="scratch"></div>
    <script src="./scratch-gui-standalone.js"></script>
    <script>
        // Initialize Scratch
        const target = document.getElementById('scratch');
        Scratch.gui.initializeDefault(target);
    </script>
</body>
</html>
